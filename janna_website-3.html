<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عالم جنى ❤️</title>
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; overflow:hidden;
  display:flex; align-items:center; justify-content:center;
  font-family:Tahoma,Arial,sans-serif; color:#fff; text-align:center;
  background:linear-gradient(135deg,#ff758c,#ff9a9e,#a18cd1);
}
.card{
  width:min(90%,440px); padding:36px 25px; border-radius:28px;
  background:rgba(255,255,255,.18); border:1px solid #ffffff66;
  box-shadow:0 18px 55px #70205044; backdrop-filter:blur(12px);
  position:relative; z-index:2;
}
h1{font-size:54px;margin:10px 0}
p{font-size:19px;line-height:2}
.heart{font-size:66px;animation:pulse 1s infinite}
button{
  border:0;border-radius:30px;padding:14px 26px;margin-top:12px;
  background:#fff;color:#df4f8b;font-size:18px;font-weight:bold;cursor:pointer;
}
button:active{transform:scale(.97)}
#surprise{display:none;margin-top:22px;font-size:20px;line-height:2}
.float{
 position:absolute;bottom:-50px;animation:rise linear infinite;
 opacity:.75;pointer-events:none
}
@keyframes pulse{50%{transform:scale(1.18)}}
@keyframes rise{to{transform:translateY(-115vh) rotate(360deg);opacity:0}}
.small{font-size:14px;opacity:.9;margin-top:22px}
</style>
</head>
<body>
<div class="card">
  <div style="font-size:28px">🌸 🌷 🌸</div>
  <div class="heart">💗</div>
  <h1>جنى</h1>
  <p>أهلاً بيكي في عالمك الخاص ✨<br>مكان صغير معمول علشان يرسم ابتسامة على وشك.</p>
  <button onclick="openSurprise()">افتحي المفاجأة 🎁</button>
  <div id="surprise">
    <div>🌹 يا جنى، وجودك بيخلّي الأيام ألطف 🌹</div>
    <div>أتمنالك فرحة كبيرة وأيام كلها نجاح وسعادة.</div>
    <div style="font-size:30px;margin-top:10px">💖 🦋 💐</div>
  </div>
  <div class="small">A little page made just for you ✨</div>
</div>
<script>
function openSurprise(){
 document.getElementById('surprise').style.display='block';
}
const symbols=['💗','💕','🌸','✨','🦋'];
for(let i=0;i<22;i++){
 const el=document.createElement('div');
 el.className='float';
 el.textContent=symbols[Math.floor(Math.random()*symbols.length)];
 el.style.left=Math.random()*100+'vw';
 el.style.animationDuration=(7+Math.random()*9)+'s';
 el.style.animationDelay=(-Math.random()*12)+'s';
 el.style.fontSize=(16+Math.random()*22)+'px';
 document.body.appendChild(el);
}
</script>
</body>
</html>
